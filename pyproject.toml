[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-red-ai"
version = "0.1.0"
description = "A completed recurrent-policy study of discovery, retention, and cumulative learning in Pokemon Red"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Peter Andrews Jr." },
]
license = "MIT"
keywords = [
  "reinforcement-learning",
  "recurrent-ppo",
  "continual-learning",
  "game-ai",
  "pyboy",
  "reproducible-research",
]
dependencies = [
  "numpy>=2",
  "pillow>=11",
  "pyboy==2.7.0",
]

[project.urls]
Repository = "https://github.com/PeteAndrews1289/pokemon-red-ai"
Documentation = "https://github.com/PeteAndrews1289/pokemon-red-ai/tree/main/docs"
Results = "https://github.com/PeteAndrews1289/pokemon-red-ai/tree/main/experiments/v12-final"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]
apprentice = [
  "torch==2.13.0",
]
rl = [
  "gymnasium==1.3.0",
  "sb3-contrib==2.9.0",
  "stable-baselines3==2.9.0",
  "tensorboard>=2.18",
]

[project.scripts]
pokemon-red-ai = "pokemon_red_ai.cli:main"
pokemon-red-ai-v11 = "pokemon_red_ai.v11:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a private Pokemon Red ROM",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
