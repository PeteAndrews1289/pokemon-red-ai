<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Archive v2 qualification summary</title>
  <desc id="description">Q1 used 23.87 verification actions per exploration action. The Archive v2 continuous qualification used 0.31 total, including 0.11 ordinary edge verification, and recovered exactly from a hard crash.</desc>
  <rect width="960" height="420" rx="28" fill="#0b1020"/>
  <text x="54" y="62" fill="#f7fafc" font-family="system-ui, sans-serif" font-size="30" font-weight="700">Can memory become cheap enough to learn from?</text>
  <text x="54" y="94" fill="#a8b3cf" font-family="system-ui, sans-serif" font-size="16">Directional engineering comparison · real ROM · clean published source</text>

  <rect x="54" y="132" width="350" height="176" rx="18" fill="#321a24" stroke="#ef718f" stroke-width="2"/>
  <text x="82" y="170" fill="#f6a6b8" font-family="system-ui, sans-serif" font-size="17" font-weight="700">OLD Q1 VERIFICATION COST</text>
  <text x="82" y="235" fill="#ffffff" font-family="system-ui, sans-serif" font-size="62" font-weight="800">23.87×</text>
  <text x="82" y="270" fill="#d8bac3" font-family="system-ui, sans-serif" font-size="16">verification actions / exploration action</text>
  <text x="82" y="294" fill="#9d7c86" font-family="system-ui, sans-serif" font-size="13">40,000 exploration · 954,704 replay</text>

  <path d="M425 220 H505" stroke="#6f7b9a" stroke-width="5" stroke-linecap="round"/>
  <path d="M493 207 L510 220 L493 233" fill="none" stroke="#6f7b9a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="530" y="132" width="376" height="176" rx="18" fill="#102d2a" stroke="#55d6be" stroke-width="2"/>
  <text x="558" y="170" fill="#85ebd7" font-family="system-ui, sans-serif" font-size="17" font-weight="700">ARCHIVE V2 · CONTINUOUS</text>
  <text x="558" y="230" fill="#ffffff" font-family="system-ui, sans-serif" font-size="56" font-weight="800">0.31×</text>
  <text x="760" y="218" fill="#85ebd7" font-family="system-ui, sans-serif" font-size="24" font-weight="700">total</text>
  <text x="760" y="246" fill="#b4cfc9" font-family="system-ui, sans-serif" font-size="14">with promotion replay</text>
  <text x="558" y="276" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">0.11× ordinary edge</text>
  <text x="558" y="299" fill="#82aaa2" font-family="system-ui, sans-serif" font-size="13">formal edge ceiling: 1.00×</text>

  <rect x="54" y="332" width="852" height="54" rx="14" fill="#17213a"/>
  <circle cx="83" cy="359" r="10" fill="#55d6be"/>
  <text x="105" y="365" fill="#f7fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Hard crash recovered to the exact deterministic terminal state</text>
  <text x="742" y="365" fill="#85ebd7" font-family="system-ui, sans-serif" font-size="18" font-weight="800">PASS</text>
  <text x="54" y="408" fill="#7783a3" font-family="system-ui, sans-serif" font-size="12">Q1 and Archive v2 are not matched-seed performance trials; this visual compares the measured engineering cost.</text>
</svg>
